name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    name: Unit tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest tests/unit tests/integration/test_sources.py --cov --cov-report=term-missing

  docker:
    name: Docker integration & end-to-end
    runs-on: ubuntu-latest   # GitHub's Linux runners ship a working Docker daemon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run agentenv doctor
      - run: uv run pytest tests/integration tests/e2e -m docker
      - name: Failure-isolation benchmark (deterministic agents, expected outcomes)
        run: |
          uv run agentenv experiment run benchmarks/failure-isolation/experiment.yaml --output "$RUNNER_TEMP/failure-isolation"
          uv run python benchmarks/check_failure_isolation.py "$RUNNER_TEMP/failure-isolation"
      - name: No orphaned sandboxes
        run: test -z "$(docker ps -aq --filter label=io.agentenvforge.run-id)"

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Install wheel in a clean environment and smoke-test the CLI
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/agentenv version
          /tmp/smoke/bin/agentenv task validate examples/basic/task.yaml
          /tmp/smoke/bin/agentenv experiment validate benchmarks/infrastructure/experiment.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
